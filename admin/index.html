<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Erosioni</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@400;500;600&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F0E8;--text:#2B2723;--accent:#A65A43;--muted:#6B6157;--surface:#FFFFFF;--border:#D8D0C4;--radius:12px;--shadow:0 4px 20px rgba(43,39,35,0.08);}
*{box-sizing:border-box}body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);margin:0;padding:40px 20px;line-height:1.6;}
.container{max-width:960px;margin:0 auto;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:40px;}
h1{font-family:'Playfair Display',serif;font-size:2.2rem;margin:0 0 8px;font-weight:600;}
.subtitle{color:var(--muted);margin-bottom:32px;font-size:0.95rem;}
.field{margin-bottom:24px;}label{display:block;font-weight:500;margin-bottom:6px;font-size:0.9rem;}
input[type="file"],input[type="text"],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:0.95rem;background:#FAFAF8;}
textarea{min-height:180px;resize:vertical;line-height:1.7;font-family:'Space Mono',monospace;font-size:0.85rem;}
.btn-primary{background:var(--accent);color:#fff;border:none;padding:12px 28px;border-radius:8px;font-weight:600;cursor:pointer;font-size:1rem;transition:opacity .2s;}
.btn-primary:hover{opacity:.85;}
.btn-secondary{background:transparent;color:var(--accent);border:1px solid var(--accent);padding:10px 20px;border-radius:8px;font-weight:500;cursor:pointer;}
.btn-group{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px;}
.preview{background:#FAFAF8;border:1px solid var(--border);border-radius:8px;padding:24px;margin-top:24px;min-height:120px;}
.preview h2{font-family:'Playfair Display',serif;font-size:1.3rem;margin-top:0;}
.note{font-size:0.82rem;color:var(--muted);margin-top:8px;}
.status{margin-top:16px;font-size:0.9rem;color:var(--muted);}
</style>
</head>
<body>
<div class="container">
  <h1>Pannello Admin</h1>
  <p class="subtitle">Gestisci articoli, portfolio e impostazioni del sito.</p>

  <div class="btn-group">
    <a href="editor.html" class="btn-primary" style="text-decoration:none;display:inline-block;">✏️ Editor visuale</a>
    <a href="importa.html" class="btn-secondary" style="text-decoration:none;display:inline-block;">📄 Importa da Word</a>
  </div>

  <div class="field">
    <label for="jsonFile">Carica JSON sito</label>
    <input type="file" id="jsonFile" accept=".json">
    <p class="note">Carica articoli.json, portfolio.json, impostazioni.json o scatti.json.</p>
  </div>

  <div class="field">
    <label for="jsonOutput">Contenuto JSON</label>
    <textarea id="jsonOutput" placeholder="Il contenuto JSON apparirà qui..."></textarea>
  </div>

  <button class="btn-primary" id="btnDownload">Scarica JSON</button>
  <p class="status" id="status"></p>

  <div class="preview" id="preview">
    <h2>Anteprima dati</h2>
    <div id="previewBody">Carica un file per vedere l'anteprima.</div>
  </div>
</div>

<script>
document.getElementById('jsonFile').addEventListener('change', function(e){
  var file=e.target.files[0]; if(!file) return;
  var reader=new FileReader();
  reader.onload=function(event){
    var text=event.target.result;
    document.getElementById('jsonOutput').value=text;
    try{
      var data=JSON.parse(text);
      document.getElementById('previewBody').innerHTML='<pre style="white-space:pre-wrap;font-size:0.8rem;">'+JSON.stringify(data,null,2).substring(0,2000)+'...</pre>';
      document.getElementById('status').textContent='File caricato: '+Object.keys(data).length+' chiavi';
    }catch(err){
      document.getElementById('status').textContent='Errore JSON: '+err.message;
    }
  };
  reader.readAsText(file);
});

document.getElementById('btnDownload').addEventListener('click',function(){
  var text=document.getElementById('jsonOutput').value;
  if(!text){document.getElementById('status').textContent='Nessun contenuto da scaricare.'; return;}
  var blob=new Blob([text],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a'); a.href=url; a.download='dati.json'; a.click();
  URL.revokeObjectURL(url);
  document.getElementById('status').textContent='Download avviato.';
});
</script>
</body>
</html>
