<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editor — Erosioni</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@400;500;600&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{--bg:#F5F0E8;--text:#2B2723;--accent:#A65A43;--muted:#6B6157;--surface:#FFFFFF;--border:#D8D0C4;--radius:12px;--shadow:0 4px 20px rgba(43,39,35,0.08);}
  *{box-sizing:border-box}body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);margin:0;height:100vh;overflow:hidden;}
  .editor-wrap { display: grid; grid-template-columns: 1fr 1fr; height: 100vh; }
  .editor-col {
    display: flex; flex-direction: column;
    background: #F5F0E8;
    overflow: hidden;
  }
  .editor-scroll {
    flex: 1; overflow-y: auto;
    padding: 22px 24px;
  }
  .editor-title {
    font-size: 1.3rem; font-weight: 600; margin: 0 0 4px;
    font-family: Playfair Display, Georgia, serif;
  }
  .editor-sub {
    color: #6B6157; font-size: 0.88rem; margin: 0 0 18px;
  }
  .field { margin-bottom: 14px; }
  .field label {
    display: block; font-size: 0.75rem; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.04em;
    color: #6B6157; margin-bottom: 4px;
  }
  .field input, .field select, .field textarea {
    width: 100%; padding: 8px 11px;
    font: inherit; font-size: 0.93rem;
    border: 1px solid rgba(43,39,35,0.2); border-radius: 8px;
    background: #fff; color: #2B2723;
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    outline: 0; border-color: #A65A43;
    box-shadow: 0 0 0 3px rgba(166,90,67,0.1);
  }
  .field textarea { min-height: 280px; resize: vertical; font: 13px/1.6 ui-monospace, Menlo, monospace; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .toolbar {
    display: flex; flex-wrap: wrap; gap: 5px;
    margin-bottom: 8px;
  }
  .toolbar button {
    font: inherit; font-size: 0.78rem; cursor: pointer;
    background: #fff; color: #2B2723;
    border: 1px solid rgba(43,39,35,0.16); border-radius: 6px;
    padding: 5px 9px; white-space: nowrap;
  }
  .toolbar button:hover { background: rgba(166,90,67,0.08); border-color: #A65A43; }
  .toolbar-sep { width: 1px; background: rgba(43,39,35,0.12); margin: 0 2px; }
  .toolbar small { color: #6B6157; font-size: 0.72rem; align-self: center; margin-left: auto; }

  .actions-bar {
    padding: 12px 24px;
    border-top: 1px solid rgba(43,39,35,0.1);
    background: #fff;
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  }
  .btn-primary {
    font: inherit; font-size: 0.88rem; cursor: pointer;
    background: #A65A43; color: #fff; border: 0; border-radius: 8px;
    padding: 9px 16px; font-weight: 500;
  }
  .btn-primary:hover { background: #8f4c38; }
  .btn-secondary {
    font: inherit; font-size: 0.88rem; cursor: pointer;
    background: transparent; color: #2B2723;
    border: 1px solid rgba(43,39,35,0.22); border-radius: 8px;
    padding: 9px 16px;
  }
  .btn-secondary:hover { background: rgba(43,39,35,0.04); }
  .status { font-size: 0.78rem; color: #6B6157; margin-left: auto; }

  /* Preview */
  .preview-col {
    background: #EAE5DD;
    overflow-y: auto;
    padding: 32px 28px 60px;
  }
  .preview-header {
    position: sticky; top: 0; z-index: 10;
    background: #EAE5DD;
    padding: 10px 0;
    border-bottom: 1px solid rgba(43,39,35,0.08);
    margin-bottom: 20px;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 0.78rem; color: #6B6157; text-transform: uppercase; letter-spacing: 0.06em;
  }
  .preview-back { color: #A65A43; text-decoration: none; font-size: 0.82rem; letter-spacing: 0.04em; text-transform: uppercase; }
  .preview-back:hover { text-decoration: underline; }
  .preview-title { font-family: Playfair Display, Georgia, serif; font-size: 2.4rem; font-weight: 500; line-height: 1.15; margin: 16px 0 8px; color: #2B2723; }
  .preview-subtitle { font-size: 1.15rem; color: #6B6157; margin: 0 0 16px; line-height: 1.5; }
  .preview-meta-row { display: flex; gap: 24px; margin-bottom: 24px; font-size: 0.82rem; color: #6B6157; text-transform: uppercase; letter-spacing: 0.04em; }
  .preview-meta-row span strong { color: #2B2723; font-weight: 600; }
  .preview-hero { width: 100%; border-radius: 8px; margin-bottom: 28px; display: block; }
  .preview-body { font-size: 1.05rem; line-height: 1.75; color: #3A3530; }
  .preview-body p { margin: 0 0 1.1em; }
  .preview-body h2 { font-family: Playfair Display, Georgia, serif; font-size: 1.7rem; font-weight: 500; margin: 36px 0 16px; color: #2B2723; }
  .preview-body h3 { font-family: Playfair Display, Georgia, serif; font-size: 1.25rem; font-weight: 500; margin: 24px 0 10px; color: #2B2723; }
  .preview-body blockquote { margin: 24px 0; padding: 8px 0 8px 20px; border-left: 3px solid #A65A43; font-style: italic; color: #6B6157; }
  .preview-body img { max-width: 100%; border-radius: 6px; margin: 20px 0; display: block; }
  .preview-body a { color: #A65A43; text-decoration: underline; }
  .preview-body .citazione-lunga { margin: 24px 36px; padding: 16px 24px; border-left: 3px solid #A65A43; border-right: 3px solid #A65A43; font-style: italic; color: #6B6157; background: rgba(166,90,67,0.04); border-radius: 4px; }

  /* Modal */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 1000;
    background: rgba(26,24,22,0.5);
    display: none; align-items: center; justify-content: center;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: #F5F0E8; border-radius: 14px;
    max-width: 720px; width: 100%; max-height: 85vh;
    display: flex; flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,0.22);
  }
  .modal-head { padding: 16px 20px 0; display: flex; justify-content: space-between; align-items: center; }
  .modal-head h3 { margin: 0; font-size: 1.05rem; }
  .modal-close { background: none; border: 0; font-size: 1.4rem; cursor: pointer; color: #6B6157; }
  .modal-body { padding: 12px 20px 20px; flex: 1; overflow: hidden; display: flex; flex-direction: column; }
  .modal-body p { margin: 0 0 8px; font-size: 0.88rem; color: #6B6157; }
  .modal-body textarea {
    flex: 1; width: 100%; font: 12px/1.6 ui-monospace, Menlo, monospace;
    border: 1px solid rgba(43,39,35,0.2); border-radius: 8px; padding: 12px;
    background: #fff; resize: none;
  }
  .modal-foot { padding: 0 20px 16px; display: flex; gap: 8px; justify-content: flex-end; }
</style>
</head>
<body>
<div class="editor-wrap">
  <div class="editor-col">
    <div class="editor-scroll">
      <h1 class="editor-title">Editor Articolo</h1>
      <p class="editor-sub">Crea o modifica un articolo per il blog.</p>

      <div class="field-row">
        <div class="field">
          <label for="artTitle">Titolo</label>
          <input type="text" id="artTitle" placeholder="Titolo dell'articolo">
        </div>
        <div class="field">
          <label for="artSlug">Slug</label>
          <input type="text" id="artSlug" placeholder="auto-generato">
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="artCategory">Categoria</label>
          <input type="text" id="artCategory" placeholder="es. Filosofia">
        </div>
        <div class="field">
          <label for="artDate">Data</label>
          <input type="date" id="artDate">
        </div>
      </div>

      <div class="field">
        <label for="artExcerpt">Estratto (2-3 righe)</label>
        <textarea id="artExcerpt" rows="3" placeholder="Breve descrizione dell'articolo..."></textarea>
      </div>

      <div class="field">
        <label for="artImage">URL immagine di copertina</label>
        <input type="text" id="artImage" placeholder="https://...">
      </div>

      <div class="field">
        <label>Contenuto HTML</label>
        <div class="toolbar">
          <button type="button" onclick="wrapSel('h2')">H2</button>
          <button type="button" onclick="wrapSel('h3')">H3</button>
          <button type="button" onclick="wrapSel('p')">p</button>
          <button type="button" onclick="wrapSel('strong')">Grassetto</button>
          <button type="button" onclick="wrapSel('em')">Corsivo</button>
          <button type="button" onclick="insertAtCursor('[nota]','[/nota]')">Nota</button>
          <button type="button" onclick="insertAtCursor('[colore #hex]','[/colore]')">Colore</button>
          <button type="button" onclick="insertAtCursor('[font nome]','[/font]')">Font</button>
          <button type="button" onclick="insertAtCursor('[interlinea 1.8]','[/interlinea]')">Interlinea</button>
          <button type="button" onclick="insertAtCursor('[riga-vuota]','')">Riga vuota</button>
          <button type="button" onclick="insertAtCursor('[blocco]','[/blocco]')">Blocco</button>
          <button type="button" onclick="insertAtCursor('[blocco-font nome]','[/blocco-font]')">Blocco font</button>
          <button type="button" onclick="insertAtCursor('[citazione]','[/citazione]')">Citazione lunga</button>
          <span class="toolbar-sep"></span>
          <small>Seleziona testo e clicca</small>
        </div>
        <textarea id="artContent" rows="12" placeholder="Scrivi il contenuto HTML dell'articolo..."></textarea>
      </div>

      <div class="field">
        <label for="artReadingTime">Tempo di lettura</label>
        <input type="text" id="artReadingTime" placeholder="es. 8 min">
      </div>
    </div>

    <div class="actions-bar">
      <button class="btn-primary" id="btnPreview">Anteprima</button>
      <button class="btn-secondary" id="btnSaveLocal">Salva JSON locale</button>
      <button class="btn-primary" id="btnPublish">Pubblica su GitHub</button>
      <span class="status" id="status"></span>
    </div>
  </div>

  <div class="preview-col" id="previewCol">
    <div class="preview-header">
      <span>Anteprima</span>
      <a href="index.html" class="preview-back">← Torna al sito</a>
    </div>
    <div id="previewBody">
      <p style="color:#6B6157;font-style:italic">Compila i campi a sinistra e clicca "Anteprima".</p>
    </div>
  </div>
</div>

<!-- Modal JSON -->
<div class="modal-overlay" id="jsonModal">
  <div class="modal-box">
    <div class="modal-head"><h3>JSON Articolo</h3><button class="modal-close" onclick="document.getElementById('jsonModal').classList.remove('open')">&times;</button></div>
    <div class="modal-body"><p>Copia questo JSON e salvalo in <code>content/articoli.json</code> su GitHub.</p><textarea id="jsonOutput" readonly></textarea></div>
    <div class="modal-foot">
      <button class="btn-secondary" onclick="document.getElementById('jsonModal').classList.remove('open')">Chiudi</button>
      <button class="btn-primary" onclick="copyJSON()">Copia</button>
    </div>
  </div>
</div>

<script>
/* ---------- Toolbar ---------- */
function wrapSel(tag) {
  const ta = document.getElementById('artContent');
  const s = ta.selectionStart, e = ta.selectionEnd;
  const selected = ta.value.substring(s, e);
  const wrapped = `<${tag}>${selected}</${tag}>`;
  ta.value = ta.value.substring(0, s) + wrapped + ta.value.substring(e);
  ta.selectionStart = s; ta.selectionEnd = s + wrapped.length;
  ta.focus();
}
function insertAtCursor(before, after) {
  const ta = document.getElementById('artContent');
  const s = ta.selectionStart, e = ta.selectionEnd;
  const selected = ta.value.substring(s, e);
  const inserted = before + selected + after;
  ta.value = ta.value.substring(0, s) + inserted + ta.value.substring(e);
  ta.selectionStart = s + before.length; ta.selectionEnd = s + before.length + selected.length;
  ta.focus();
}

/* ---------- Preview ---------- */
function buildArticle() {
  return {
    title: document.getElementById('artTitle').value.trim(),
    slug: document.getElementById('artSlug').value.trim() || slugify(document.getElementById('artTitle').value),
    category: document.getElementById('artCategory').value.trim(),
    date: document.getElementById('artDate').value,
    excerpt: document.getElementById('artExcerpt').value.trim(),
    image: document.getElementById('artImage').value.trim(),
    content: document.getElementById('artContent').value.trim(),
    reading_time: document.getElementById('artReadingTime').value.trim(),
  };
}

function slugify(text) {
  return text.toString().toLowerCase()
    .replace(/\s+/g, '-')
    .replace(/[^\w\-]+/g, '')
    .replace(/\-\-+/g, '-')
    .replace(/^-+/, '')
    .replace(/-+$/, '');
}

function parseShortcodes(html) {
  html = html.replace(/\[nota\]([\s\S]*?)\[\/nota\]/g, '<span class="nota">$1</span>');
  html = html.replace(/\[colore\s+([#\w]+)\]([\s\S]*?)\[\/colore\]/g, '<span style="color:$1">$2</span>');
  html = html.replace(/\[font\s+([\w-]+)\]([\s\S]*?)\[\/font\]/g, '<span style="font-family:$1">$2</span>');
  html = html.replace(/\[interlinea\s+(\d+(?:\.\d+)?)\]([\s\S]*?)\[\/interlinea\]/g, '<span style="line-height:$1">$2</span>');
  html = html.replace(/\[riga-vuota\]/g, '<div style="height:1.5em"></div>');
  html = html.replace(/\[blocco\]([\s\S]*?)\[\/blocco\]/g, '<div class="blocco">$1</div>');
  html = html.replace(/\[blocco-font\s+([\w-]+)\]([\s\S]*?)\[\/blocco-font\]/g, '<div style="font-family:$1">$1</div>');
  html = html.replace(/\[citazione\]([\s\S]*?)\[\/citazione\]/g, '<blockquote class="citazione-lunga">$1</blockquote>');
  return html;
}

document.getElementById('btnPreview').addEventListener('click', () => {
  const art = buildArticle();
  if (!art.title) { document.getElementById('status').textContent = 'Inserisci almeno il titolo.'; return; }
  const body = parseShortcodes(art.content);
  document.getElementById('previewBody').innerHTML = `
    <div class="preview-meta-row">
      <span><strong>${art.category || '—'}</strong></span>
      <span>${art.date || '—'}</span>
      <span>${art.reading_time || '—'}</span>
    </div>
    ${art.image ? `<img class="preview-hero" src="${art.image}" alt="">` : ''}
    <h1 class="preview-title">${art.title}</h1>
    <p class="preview-subtitle">${art.excerpt}</p>
    <div class="preview-body">${body}</div>
  `;
  document.getElementById('status').textContent = 'Anteprima aggiornata.';
});

/* ---------- Salva JSON locale ---------- */
document.getElementById('btnSaveLocal').addEventListener('click', () => {
  const art = buildArticle();
  if (!art.title) { document.getElementById('status').textContent = 'Inserisci almeno il titolo.'; return; }
  document.getElementById('jsonOutput').value = JSON.stringify(art, null, 2);
  document.getElementById('jsonModal').classList.add('open');
  document.getElementById('status').textContent = 'JSON pronto per la copia.';
});

function copyJSON() {
  const ta = document.getElementById('jsonOutput');
  ta.select();
  document.execCommand('copy');
  document.getElementById('status').textContent = 'JSON copiato negli appunti.';
}

/* ---------- Pubblica su GitHub ---------- */
document.getElementById('btnPublish').addEventListener('click', async () => {
  const art = buildArticle();
  if (!art.title) { document.getElementById('status').textContent = 'Inserisci almeno il titolo.'; return; }
  
  document.getElementById('status').textContent = 'Caricamento articoli.json...';
  
  try {
    const articles = await fetch('https://raw.githubusercontent.com/davideamatoag/Erosioni/main/content/articoli.json?v=' + Date.now()).then(r => r.json());
    const existing = articles.findIndex(a => a.slug === art.slug);
    if (existing >= 0) articles[existing] = art;
    else articles.unshift(art);
    
    /* Salva articoli.json */
    await saveFileToGitHub('content/articoli.json', JSON.stringify(articles, null, 2), 'Aggiorna articoli.json');
    
    /* Genera pagina statica */
    const staticHtml = generateStaticPage(art);
    await saveFileToGitHub('articoli/' + art.slug + '.html', staticHtml, 'Aggiungi pagina statica ' + art.slug);
    
    document.getElementById('status').textContent = 'Pubblicato! Ricarica il sito tra 2-3 minuti.';
  } catch(e) {
    document.getElementById('status').textContent = 'Errore: ' + e.message;
  }
});

/* ---------- Genera pagina statica ---------- */
function generateStaticPage(article) {
  const baseUrl = 'https://davideamatoag.github.io/Erosioni';
  const body = parseShortcodes(article.content);
  return `<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${article.title} — Erosioni</title>
<meta name="description" content="${article.excerpt.replace(/"/g, '&quot;')}">
<meta property="og:title" content="${article.title}">
<meta property="og:description" content="${article.excerpt.replace(/"/g, '&quot;')}">
<meta property="og:image" content="${article.image ? (article.image.startsWith('http') ? article.image : baseUrl + '/' + article.image) : ''}">
<meta property="og:url" content="${baseUrl}/articoli/${article.slug}.html">
<meta property="og:type" content="article">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="${article.title}">
<meta name="twitter:description" content="${article.excerpt.replace(/"/g, '&quot;')}">
<meta name="twitter:image" content="${article.image ? (article.image.startsWith('http') ? article.image : baseUrl + '/' + article.image) : ''}">
<script>
  window.location.href = '../articolo.html?slug=${article.slug}';
<\/script>
</head>
<body>
<p>Reindirizzamento in corso...</p>
</body>
</html>`;
}

/* ---------- Helper GitHub ---------- */
async function saveFileToGitHub(path, content, message) {
  const token = prompt('Inserisci il tuo GitHub Personal Access Token:');
  if (!token) throw new Error('Token richiesto');
  
  const apiUrl = 'https://api.github.com/repos/davideamatoag/Erosioni/contents/' + path;
  
  /* Ottieni SHA se il file esiste */
  let sha = null;
  try {
    const r = await fetch(apiUrl + '?ref=main', { headers: { 'Authorization': 'token ' + token } });
    if (r.ok) { const data = await r.json(); sha = data.sha; }
  } catch(e) {}
  
  const body = {
    message: message,
    content: btoa(unescape(encodeURIComponent(content))),
    branch: 'main'
  };
  if (sha) body.sha = sha;
  
  const r = await fetch(apiUrl, {
    method: 'PUT',
    headers: {
      'Authorization': 'token ' + token,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(body)
  });
  
  if (!r.ok) throw new Error('GitHub ' + r.status + ': ' + await r.text());
}
</script>
</body>
</html>
