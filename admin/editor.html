<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor articoli — Erosioni</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@400;500;600&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: Inter, system-ui, sans-serif;
    background: #F5F0E8; color: #2B2723;
    height: 100vh; overflow: hidden;
  }
  .editor-layout {
    display: grid;
    grid-template-columns: 1fr 520px;
    height: 100vh;
  }
  .preview-col {
    background: #EAE5DD;
    border-right: 1px solid rgba(43,39,35,0.12);
    display: flex; flex-direction: column;
  }
  .preview-col iframe {
    flex: 1; width: 100%; border: 0;
    background: #EAE5DD;
  }
  .preview-header {
    padding: 10px 18px;
    font-size: 0.8rem; color: #6B6157;
    background: rgba(43,39,35,0.04);
    border-bottom: 1px solid rgba(43,39,35,0.08);
    display: flex; justify-content: space-between; align-items: center;
  }
  .editor-col {
    display: flex; flex-direction: column;
    background: #F5F0E8;
    overflow: hidden;
  }
  .editor-scroll {
    flex: 1; overflow-y: auto;
    padding: 24px;
  }
  .editor-title {
    font-size: 1.35rem; font-weight: 600; margin: 0 0 4px;
    font-family: Playfair Display, Georgia, serif;
  }
  .editor-sub {
    color: #6B6157; font-size: 0.9rem; margin: 0 0 20px;
  }
  .field { margin-bottom: 16px; }
  .field label {
    display: block; font-size: 0.8rem; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.04em;
    color: #6B6157; margin-bottom: 5px;
  }
  .field input, .field select, .field textarea {
    width: 100%; padding: 9px 12px;
    font: inherit; font-size: 0.95rem;
    border: 1px solid rgba(43,39,35,0.22); border-radius: 8px;
    background: #fff; color: #2B2723;
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    outline: 0; border-color: #A65A43;
    box-shadow: 0 0 0 3px rgba(166,90,67,0.12);
  }
  .field textarea { min-height: 320px; resize: vertical; font: 13px/1.65 ui-monospace, Menlo, monospace; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  /* Toolbar */
  .toolbar {
    display: flex; flex-wrap: wrap; gap: 6px;
    margin-bottom: 10px;
  }
  .toolbar button {
    font: inherit; font-size: 0.82rem; cursor: pointer;
    background: #fff; color: #2B2723;
    border: 1px solid rgba(43,39,35,0.18); border-radius: 6px;
    padding: 5px 10px; white-space: nowrap;
    transition: background .12s, border-color .12s;
  }
  .toolbar button:hover { background: rgba(166,90,67,0.08); border-color: #A65A43; }
  .toolbar button.active { background: #A65A43; color: #fff; border-color: #A65A43; }
  .toolbar-sep { width: 1px; background: rgba(43,39,35,0.15); margin: 0 2px; }
  .toolbar small { color: #6B6157; font-size: 0.75rem; align-self: center; margin-left: auto; }

  /* Azioni in fondo */
  .actions-bar {
    padding: 14px 24px;
    border-top: 1px solid rgba(43,39,35,0.1);
    background: #fff;
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  }
  .btn-primary {
    font: inherit; font-size: 0.92rem; cursor: pointer;
    background: #A65A43; color: #fff; border: 0; border-radius: 8px;
    padding: 10px 18px; font-weight: 500;
  }
  .btn-primary:hover { background: #8f4c38; }
  .btn-secondary {
    font: inherit; font-size: 0.92rem; cursor: pointer;
    background: transparent; color: #2B2723;
    border: 1px solid rgba(43,39,35,0.25); border-radius: 8px;
    padding: 10px 18px;
  }
  .btn-secondary:hover { background: rgba(43,39,35,0.05); }
  .status { font-size: 0.8rem; color: #6B6157; margin-left: auto; }

  /* Modal esporta */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 1000;
    background: rgba(26,24,22,0.55);
    display: none; align-items: center; justify-content: center;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: #F5F0E8; border-radius: 14px;
    max-width: 720px; width: 100%; max-height: 85vh;
    display: flex; flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
  }
  .modal-head {
    padding: 18px 22px 0; display: flex; justify-content: space-between; align-items: center;
  }
  .modal-head h3 { margin: 0; font-size: 1.1rem; }
  .modal-close {
    background: none; border: 0; font-size: 1.4rem; cursor: pointer; color: #6B6157;
  }
  .modal-body { padding: 14px 22px 22px; flex: 1; overflow: hidden; display: flex; flex-direction: column; }
  .modal-body p { margin: 0 0 10px; font-size: 0.9rem; color: #6B6157; }
  .modal-body textarea {
    flex: 1; width: 100%; font: 12px/1.6 ui-monospace, Menlo, monospace;
    border: 1px solid rgba(43,39,35,0.22); border-radius: 8px; padding: 12px;
    background: #fff; resize: none;
  }
  .modal-foot {
    padding: 0 22px 18px; display: flex; gap: 10px; justify-content: flex-end;
  }

  /* Responsive */
  @media (max-width: 980px) {
    .editor-layout { grid-template-columns: 1fr; grid-template-rows: 45vh 1fr; }
    .preview-col { border-right: 0; border-bottom: 1px solid rgba(43,39,35,0.12); }
  }
</style>
</head>
<body>

<div class="editor-layout">
  <!-- PREVIEW -->
  <div class="preview-col">
    <div class="preview-header">
      <span>Anteprima live</span>
      <span id="previewStats"></span>
    </div>
    <iframe id="previewFrame" sandbox="allow-same-origin"></iframe>
  </div>

  <!-- EDITOR -->
  <div class="editor-col">
    <div class="editor-scroll">
      <h1 class="editor-title">Editor articoli</h1>
      <p class="editor-sub">Scrivi qui e vedi il risultato a sinistra.</p>

      <div class="field-row">
        <div class="field">
          <label for="inpSlug">Slug (URL)</label>
          <input type="text" id="inpSlug" placeholder="es. la-rinascita-dell-ontologia">
        </div>
        <div class="field">
          <label for="inpDate">Data</label>
          <input type="date" id="inpDate">
        </div>
      </div>

      <div class="field">
        <label for="inpTitle">Titolo</label>
        <input type="text" id="inpTitle" placeholder="Titolo dell'articolo">
      </div>

      <div class="field">
        <label for="inpSubtitle">Sottotitolo (facoltativo)</label>
        <input type="text" id="inpSubtitle" placeholder="">
      </div>

      <div class="field-row">
        <div class="field">
          <label for="inpCategory">Categoria</label>
          <select id="inpCategory">
            <option value="recensioni">Recensioni</option>
            <option value="cinema">Cinema</option>
            <option value="politica">Politica</option>
            <option value="riflessioni">Riflessioni</option>
          </select>
        </div>
        <div class="field">
          <label for="inpImage">Immagine di copertina (URL)</label>
          <input type="text" id="inpImage" placeholder="https://res.cloudinary.com/...">
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="inpFont">Font</label>
          <select id="inpFont">
            <option value="predefinito">Predefinito</option>
            <option value="elegante">Elegante</option>
            <option value="classico">Classico</option>
            <option value="macchina">Macchina da scrivere</option>
          </select>
        </div>
        <div class="field">
          <label for="inpColore">Colore testo</label>
          <select id="inpColore">
            <option value="predefinito">Predefinito</option>
            <option value="avorio">Avorio</option>
            <option value="sabbia">Sabbia</option>
            <option value="oro">Oro</option>
            <option value="terracotta">Terracotta</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label>Toolbar</label>
        <div class="toolbar">
          <button type="button" onclick="wrap('**','**')" title="Grassetto">B</button>
          <button type="button" onclick="wrap('*','*')" title="Corsivo">I</button>
          <button type="button" onclick="wrap('~~','~~')" title="Barrato">S</button>
          <button type="button" onclick="wrap('## ')" title="Titolo">H2</button>
          <button type="button" onclick="wrap('### ')" title="Sottotitolo">H3</button>
          <span class="toolbar-sep"></span>
          <button type="button" onclick="insertNote()" title="Nota a piè di pagina">📝 Nota</button>
          <button type="button" onclick="insertColor()" title="Colore testo">🎨 Colore</button>
          <button type="button" onclick="insertFont()" title="Font">🔤 Font</button>
          <button type="button" onclick="insertInterlinea()" title="Interlinea">📐 Interlinea</button>
          <span class="toolbar-sep"></span>
          <button type="button" onclick="wrap('> ')" title="Citazione">❝ Citaz.</button>
          <button type="button" onclick="insertEmptyLine()" title="Riga vuota extra">⬜ Riga</button>
          <button type="button" onclick="insertImage()" title="Immagine inline">🖼️ Img</button>
          <small>Scorciatoie: seleziona testo e premi un pulsante</small>
        </div>
      </div>

      <div class="field">
        <label for="inpBody">Testo dell'articolo (markdown)</label>
        <textarea id="inpBody" placeholder="Scrivi qui il testo..."></textarea>
      </div>

      <div class="field">
        <label>Carica articolo esistente</label>
        <div style="display:flex;gap:8px;">
          <input type="text" id="loadSlug" placeholder="Slug dell'articolo" style="flex:1;">
          <button type="button" class="btn-secondary" onclick="loadExisting()">Carica</button>
        </div>
        <p style="font-size:0.8rem;color:#6B6157;margin:4px 0 0;">Scarica l'articolo dal JSON remoto e riempie i campi.</p>
      </div>
    </div>

    <div class="actions-bar">
      <button class="btn-primary" onclick="exportJSON()">Esporta JSON</button>
      <button class="btn-secondary" onclick="copyBody()">Copia solo testo</button>
      <button class="btn-secondary" onclick="clearAll()">Svuota</button>
      <span class="status" id="status"></span>
    </div>
  </div>
</div>

<!-- MODAL ESPORTA -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <div class="modal-head">
      <h3>JSON articolo pronto</h3>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body">
      <p>Copia questo frammento e incollalo nell'array <code>articles</code> di <code>content/articoli.json</code> su GitHub.</p>
      <textarea id="exportArea" readonly></textarea>
    </div>
    <div class="modal-foot">
      <button class="btn-secondary" onclick="closeModal()">Chiudi</button>
      <button class="btn-primary" onclick="copyExport()">Copia negli appunti</button>
    </div>
  </div>
</div>

<script>
// ---------- Funzioni di rendering (dal sito) ----------
const MONTHS_IT = ['GEN','FEB','MAR','APR','MAG','GIU','LUG','AGO','SET','OTT','NOV','DIC'];
const CATEGORY_LABELS = { recensioni:'Recensioni', cinema:'Cinema', politica:'Politica', riflessioni:'Riflessioni' };

function formatDateIt(isoDate) {
  const d = new Date(isoDate + 'T00:00:00');
  if (isNaN(d)) return isoDate;
  return `${d.getDate()} ${MONTHS_IT[d.getMonth()]} ${d.getFullYear()}`;
}
function categoryLabel(cat) { return CATEGORY_LABELS[cat] || cat; }

function optimizeImage(url, width) {
  if (!url || !url.includes('res.cloudinary.com') || !url.includes('/upload/')) return url;
  const marker = '/upload/';
  const i = url.indexOf(marker) + marker.length;
  const already = /\/upload\/[a-z0-9_,]*\b(f_auto|q_auto)\b/.test(url);
  if (already) return url;
  const transform = `f_auto,q_auto:good,w_${width || 1600}/`;
  return url.slice(0, i) + transform + url.slice(i);
}

function stileClassi(attrs, perBlocco) {
  const COLORI = ['avorio','sabbia','oro','terracotta'];
  const FONT = ['elegante','classico','macchina'];
  const classi = [];
  (attrs || '').split(',').forEach((parte) => {
    const [chiave, valore] = parte.split(':');
    if (chiave === 'c' && COLORI.includes(valore)) classi.push((perBlocco ? 'blocco-' : 't-') + valore);
    if (chiave === 'f' && FONT.includes(valore)) classi.push((perBlocco ? 'blocco-font-' : 't-font-') + valore);
  });
  return classi.join(' ');
}

function renderInline(text) {
  return text
    .replace(/\[u\]([\s\S]*?)\[\/u\]/g, '<u>$1</u>')
    .replace(/\[s\]([\s\S]*?)\[\/s\]/g, '<s>$1</s>')
    .replace(/~~([^~]+)~~/g, '<s>$1</s>')
    .replace(/\[interlinea=([\d.]+)\]([\s\S]*?)\[\/interlinea\]/g, '<span style="line-height:$1">$2</span>')
    .replace(/\[riga-vuota\]/g, '')
    .replace(/\[stile=([^\]]+)\]([\s\S]*?)\[\/stile\]/g, (m, attrs, contenuto) => {
      const classi = stileClassi(attrs, false);
      return classi ? `<span class="${classi}">${contenuto}</span>` : contenuto;
    })
    .replace(/\[colore=(avorio|sabbia|oro|terracotta)\]([\s\S]*?)\[\/colore\]/g, '<span class="t-$1">$2</span>')
    .replace(/\[font=(elegante|classico|macchina)\]([\s\S]*?)\[\/font\]/g, '<span class="t-font-$1">$2</span>')
    .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (m, alt, url) =>
      `<img class="article-inline-img" src="${optimizeImage(url.trim(),1000)}" data-full="${url.trim().replace(/"/g,'&quot;')}" alt="${alt}">`)
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\*([^*]+)\*/g, '<em>$1</em>')
    .replace(/\\_/g, '_')
    .replace(/(?<![A-Za-z0-9])_([^_]+)_(?![A-Za-z0-9])/g, '<em>$1</em>');
}

function renderMarkdown(md) {
  const note = [];
  md = (md || '').replace(/\[nota\]([\s\S]*?)\[\/nota\]/g, (m, testo) => {
    note.push(testo.trim());
    return `{{NOTA_${note.length}}}`;
  });
  const noteImportate = {};
  md = md.replace(/\[\[(\d+)\]\]\(#_ftnref\d+\)\s+([^\n]+)/g, (m, n, testo) => { noteImportate[n]=testo.trim(); return ''; });
  md = md.replace(/(^|\n\s*\n)\s*\[\[(\d+)\]\]\(#_ftn\d+\)\s+([^\n]+)/g, (m, sep, n, testo) => { noteImportate[n]=testo.trim(); return sep; });
  md = md.replace(/\[\[(\d+)\]\]\(#_ftn(?:ref)?\d+\)/g, (m, n) => { note.push(noteImportate[n]||`Nota ${n}.`); return `{{NOTA_${note.length}}}`; });
  md = md.replace(/\s+$/, '');

  const pieces = md.split(/(\n\s*\n+)/);
  const blocks = [];
  pieces.forEach((piece, i) => {
    if (i % 2 === 0) { if (piece.trim()) blocks.push(piece); }
    else {
      const precedente = blocks.length ? blocks[blocks.length-1].trim() : '';
      const successivo = (pieces[i+1]||'').trim();
      if (/^#{1,3}\s/.test(precedente) || /^#{1,3}\s/.test(successivo)) return;
      const extra = piece.split('\n').length - 3;
      for (let k=0;k<extra;k++) blocks.push('[riga-vuota]');
    }
  });
  let html = blocks.map(block => {
    if (block === '[riga-vuota]') return '<p class="riga-vuota" aria-hidden="true"></p>';
    const trimmed = block.trim();
    const soloImmagine = trimmed.match(/^!\[([^\]]*)\]\(([^)]+)\)$/);
    if (soloImmagine) {
      const alt = soloImmagine[1].trim();
      const url = soloImmagine[2].trim();
      const img = `<img class="article-inline-img" src="${optimizeImage(url,1000)}" data-full="${url.replace(/"/g,'&quot;')}" alt="${alt.replace(/"/g,'&quot;')}">`;
      return alt ? `<figure class="article-figure">${img}<figcaption>${renderInline(alt)}</figcaption></figure>` : img;
    }
    const interlinea = trimmed.match(/^\[interlinea=([\d.]+)\]([\s\S]*?)\[\/interlinea\]$/);
    if (interlinea) return `<p style="line-height:${interlinea[1]}">${renderInline(interlinea[2]).replace(/\n/g,'<br>')}</p>`;
    const stileBlocco = trimmed.match(/^\[stile-blocco=([^\]]+)\]([\s\S]*?)\[\/stile-blocco\]$/);
    if (stileBlocco) {
      const classi = stileClassi(stileBlocco[1], true);
      const contenuto = renderInline(stileBlocco[2]).replace(/\n/g,'<br>');
      return classi ? `<p class="${classi}">${contenuto}</p>` : `<p>${contenuto}</p>`;
    }
    const blocco = trimmed.match(/^\[blocco=(avorio|sabbia|oro|terracotta)\]([\s\S]*?)\[\/blocco\]$/);
    if (blocco) return `<p class="blocco-${blocco[1]}">${renderInline(blocco[2]).replace(/\n/g,'<br>')}</p>`;
    const bloccoFont = trimmed.match(/^\[blocco-font=(elegante|classico|macchina)\]([\s\S]*?)\[\/blocco-font\]$/);
    if (bloccoFont) return `<p class="blocco-font-${bloccoFont[1]}">${renderInline(bloccoFont[2]).replace(/\n/g,'<br>')}</p>`;
    if (trimmed.startsWith('### ')) return `<h3>${renderInline(trimmed.slice(4))}</h3>`;
    if (trimmed.startsWith('## ')) return `<h2>${renderInline(trimmed.slice(3))}</h2>`;
    if (trimmed.startsWith('> ')) return `<blockquote>${renderInline(trimmed.slice(2))}</blockquote>`;
    if (/^[-•] /.test(trimmed)) {
      const items = trimmed.split('\n').map(l=>l.trim()).filter(l=>/^[-•] /.test(l)).map(l=>`<li>${renderInline(l.slice(2))}</li>`).join('');
      return `<ul>${items}</ul>`;
    }
    if (/^\d+\. /.test(trimmed)) {
      const items = trimmed.split('\n').map(l=>l.trim()).filter(l=>/^\d+\. /.test(l)).map(l=>`<li>${renderInline(l.replace(/^\d+\. /,''))}</li>`).join('');
      return `<ol>${items}</ol>`;
    }
    return `<p>${renderInline(trimmed).replace(/\n/g,'<br>')}</p>`;
  }).join('\n');

  if (note.length) {
    html = html.replace(/\{\{NOTA_(\d+)\}\}/g, (m,n) => `<sup class="nota-rif" id="rif-${n}"><a href="#nota-${n}">${n}</a></sup>`);
    html += `\n<section class="note-articolo"><h2 class="note-titolo">Note</h2><ol>` +
      note.map((t,i) => `<li id="nota-${i+1}"><span class="nota-testo">${renderInline(t)}</span> <a class="nota-back" href="#rif-${i+1}" aria-label="Torna al punto del testo">&#8617;</a></li>`).join('') +
      `</ol></section>`;
  }
  return html;
}

// ---------- Helpers textarea ----------
function wrap(before, after) {
  const ta = document.getElementById('inpBody');
  const s = ta.selectionStart, e = ta.selectionEnd;
  const val = ta.value;
  const selected = val.slice(s, e);
  const replacement = before + selected + (after || '');
  ta.value = val.slice(0, s) + replacement + val.slice(e);
  ta.selectionStart = s + before.length;
  ta.selectionEnd = s + before.length + selected.length;
  ta.focus();
  updatePreview();
}

function insertAtCursor(text) {
  const ta = document.getElementById('inpBody');
  const s = ta.selectionStart;
  ta.value = ta.value.slice(0, s) + text + ta.value.slice(s);
  ta.selectionStart = ta.selectionEnd = s + text.length;
  ta.focus();
  updatePreview();
}

function insertNote() {
  const testo = prompt('Testo della nota:');
  if (testo === null) return;
  insertAtCursor(`[nota]${testo}[/nota]`);
}

function insertColor() {
  const colori = ['avorio','sabbia','oro','terracotta'];
  const scelta = prompt(`Scegli colore: ${colori.join(', ')}`);
  if (!scelta || !colori.includes(scelta)) return;
  const ta = document.getElementById('inpBody');
  const s = ta.selectionStart, e = ta.selectionEnd;
  const sel = ta.value.slice(s, e);
  const text = sel || 'testo colorato';
  insertAtCursor(`[colore=${scelta}]${text}[/colore]`);
}

function insertFont() {
  const fonts = ['elegante','classico','macchina'];
  const scelta = prompt(`Scegli font: ${fonts.join(', ')}`);
  if (!scelta || !fonts.includes(scelta)) return;
  const ta = document.getElementById('inpBody');
  const s = ta.selectionStart, e = ta.selectionEnd;
  const sel = ta.value.slice(s, e);
  const text = sel || 'testo';
  insertAtCursor(`[font=${scelta}]${text}[/font]`);
}

function insertInterlinea() {
  const valore = prompt('Interlinea (es. 1.6, 1.8, 2):', '1.6');
  if (!valore || isNaN(parseFloat(valore))) return;
  const ta = document.getElementById('inpBody');
  const s = ta.selectionStart, e = ta.selectionEnd;
  const sel = ta.value.slice(s, e);
  const text = sel || 'testo con interlinea';
  insertAtCursor(`[interlinea=${valore}]${text}[/interlinea]`);
}

function insertEmptyLine() {
  insertAtCursor('\n\n[riga-vuota]\n\n');
}

function insertImage() {
  const url = prompt('URL immagine (Cloudinary):');
  if (!url) return;
  const alt = prompt('Didascalia (facoltativa):') || '';
  insertAtCursor(`\n\n![${alt}](${url})\n\n`);
}

// ---------- Preview ----------
function buildPreviewHTML() {
  const title = document.getElementById('inpTitle').value || 'Titolo';
  const subtitle = document.getElementById('inpSubtitle').value;
  const date = document.getElementById('inpDate').value || new Date().toISOString().slice(0,10);
  const cat = document.getElementById('inpCategory').value;
  const image = document.getElementById('inpImage').value;
  const font = document.getElementById('inpFont').value;
  const colore = document.getElementById('inpColore').value;
  const bodyMd = document.getElementById('inpBody').value;

  const fontClass = font !== 'predefinito' ? `t-font-${font}` : '';
  const coloreClass = colore !== 'predefinito' ? `t-${colore}` : '';
  const bodyClass = ['article-body', fontClass, coloreClass].filter(Boolean).join(' ');

  const htmlBody = renderMarkdown(bodyMd);

  return `<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@400;500;600&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css?v=20261108a">
<link rel="stylesheet" href="../css/style-2.css?v=20261108a">
<link rel="stylesheet" href="../css/style-3.css?v=20261108a">
<style>
  body { background:#EAE5DD; margin:0; padding:40px 20px; }
  .container { max-width: 920px; margin: 0 auto; }
</style>
</head>
<body>
  <div class="container">
    <a href="#" class="article-back">&larr; Torna agli articoli</a>
    <h1 class="article-page-title">${escapeHtml(title)}</h1>
    ${subtitle ? `<p class="article-excerpt">${escapeHtml(subtitle)}</p>` : ''}
    <div class="article-top-grid" style="margin-top:18px;">
      <div></div>
      <div class="article-top-meta">
        <div class="meta-block"><span class="meta-label">Data</span><span class="meta-value">${formatDateIt(date)}</span></div>
        <div class="meta-block"><span class="meta-label">Categoria</span><span class="meta-value">${categoryLabel(cat).toUpperCase()}</span></div>
      </div>
    </div>
    ${image ? `<div class="article-hero-frame" style="margin:28px 0;"><img class="article-hero-img" src="${optimizeImage(image,1200)}" alt=""></div>` : ''}
    <div class="article-body-grid">
      <div class="${bodyClass}">${htmlBody}</div>
      <aside class="article-sidebar">
        <div class="sidebar-block">
          <p class="sidebar-label">Autore</p>
          <p class="author-name">Davide Amato</p>
          <p class="author-bio">Scrittore, fotografo e studioso di Lukács.</p>
        </div>
      </aside>
    </div>
  </div>
</body>
</html>`;
}

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

let previewDebounce;
function updatePreview() {
  clearTimeout(previewDebounce);
  previewDebounce = setTimeout(() => {
    const frame = document.getElementById('previewFrame');
    const html = buildPreviewHTML();
    frame.srcdoc = html;
    const words = (document.getElementById('inpBody').value.match(/\S+/g) || []).length;
    document.getElementById('previewStats').textContent = `${words} parole`;
  }, 250);
}

// ---------- Export / Import ----------
function exportJSON() {
  const obj = {
    slug: document.getElementById('inpSlug').value || '',
    title: document.getElementById('inpTitle').value || '',
    sottotitolo: document.getElementById('inpSubtitle').value || '',
    category: document.getElementById('inpCategory').value,
    date: document.getElementById('inpDate').value || new Date().toISOString().slice(0,10),
    image: document.getElementById('inpImage').value || '',
    font: document.getElementById('inpFont').value,
    colore: document.getElementById('inpColore').value,
    body: document.getElementById('inpBody').value || ''
  };
  const json = JSON.stringify(obj, null, 2);
  document.getElementById('exportArea').value = json + ',';
  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
}

function copyExport() {
  const area = document.getElementById('exportArea');
  area.select();
  navigator.clipboard.writeText(area.value).then(() => {
    document.getElementById('status').textContent = 'JSON copiato ✓';
    setTimeout(() => document.getElementById('status').textContent = '', 2000);
  });
}

function copyBody() {
  const t = document.getElementById('inpBody');
  t.select();
  navigator.clipboard.writeText(t.value).then(() => {
    document.getElementById('status').textContent = 'Testo copiato ✓';
    setTimeout(() => document.getElementById('status').textContent = '', 2000);
  });
}

function clearAll() {
  if (!confirm('Svuotare tutti i campi?')) return;
  ['inpSlug','inpTitle','inpSubtitle','inpImage','inpBody'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('inpDate').value = new Date().toISOString().slice(0,10);
  document.getElementById('inpCategory').value = 'recensioni';
  document.getElementById('inpFont').value = 'predefinito';
  document.getElementById('inpColore').value = 'predefinito';
  updatePreview();
}

async function loadExisting() {
  const slug = document.getElementById('loadSlug').value.trim();
  if (!slug) return alert('Inserisci uno slug');
  try {
    const res = await fetch('../content/articoli.json', { cache: 'no-store' });
    const data = await res.json();
    const article = (data.articles || []).find(a => a.slug === slug);
    if (!article) return alert('Articolo non trovato');
    document.getElementById('inpSlug').value = article.slug || '';
    document.getElementById('inpTitle').value = article.title || '';
    document.getElementById('inpSubtitle').value = article.sottotitolo || '';
    document.getElementById('inpCategory').value = article.category || 'recensioni';
    document.getElementById('inpDate').value = article.date || '';
    document.getElementById('inpImage').value = article.image || '';
    document.getElementById('inpFont').value = article.font || 'predefinito';
    document.getElementById('inpColore').value = article.colore || 'predefinito';
    document.getElementById('inpBody').value = article.body || '';
    updatePreview();
    document.getElementById('status').textContent = `Caricato: ${article.title}`;
    setTimeout(() => document.getElementById('status').textContent = '', 3000);
  } catch (err) {
    alert('Errore caricamento: ' + err.message);
  }
}

// ---------- Init ----------
['inpSlug','inpTitle','inpSubtitle','inpCategory','inpDate','inpImage','inpFont','inpColore','inpBody'].forEach(id => {
  document.getElementById(id).addEventListener('input', updatePreview);
});
document.getElementById('inpDate').value = new Date().toISOString().slice(0,10);
updatePreview();
</script>
</body>
</html>
