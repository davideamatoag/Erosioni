<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Importa da Word — Erosioni</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@400;500;600&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F0E8;--text:#2B2723;--accent:#A65A43;--muted:#6B6157;--surface:#FFFFFF;--border:#D8D0C4;--radius:12px;--shadow:0 4px 20px rgba(43,39,35,0.08);}
*{box-sizing:border-box}body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);margin:0;padding:40px 20px;line-height:1.6;}
.container{max-width:960px;margin:0 auto;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:40px;}
h1{font-family:'Playfair Display',serif;font-size:2.2rem;margin:0 0 8px;font-weight:600;}
.subtitle{color:var(--muted);margin-bottom:32px;font-size:0.95rem;}
.field{margin-bottom:24px;}label{display:block;font-weight:500;margin-bottom:6px;font-size:0.9rem;}
input[type="file"],input[type="text"],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:0.95rem;background:#FAFAF8;}
textarea{min-height:180px;resize:vertical;line-height:1.7;font-family:'Space Mono',monospace;font-size:0.85rem;}
.btn-primary{background:var(--accent);color:#fff;border:none;padding:12px 28px;border-radius:8px;font-weight:600;cursor:pointer;font-size:1rem;transition:opacity .2s;}
.btn-primary:hover{opacity:.85;}
.btn-secondary{background:transparent;color:var(--accent);border:1px solid var(--accent);padding:10px 20px;border-radius:8px;font-weight:500;cursor:pointer;}
.preview{background:#FAFAF8;border:1px solid var(--border);border-radius:8px;padding:24px;margin-top:24px;min-height:120px;}
.preview h2{font-family:'Playfair Display',serif;font-size:1.3rem;margin-top:0;}
.note{font-size:0.82rem;color:var(--muted);margin-top:8px;}
.status{margin-top:16px;font-size:0.9rem;color:var(--muted);}
</style>
</head>
<body>
<div class="container">
  <h1>Importa da Word</h1>
  <p class="subtitle">Carica un documento .docx e convertilo nel formato markdown del blog.</p>

  <div class="field">
    <label for="wordFile">File Word (.docx)</label>
    <input type="file" id="wordFile" accept=".docx">
  </div>

  <div class="field">
    <label for="output">Markdown generato</label>
    <textarea id="output" placeholder="Il markdown apparirà qui..."></textarea>
  </div>

  <button class="btn-primary" id="btnCopy">Copia markdown</button>
  <p class="status" id="status"></p>

  <div class="preview" id="preview">
    <h2>Anteprima</h2>
    <div id="previewBody">Carica un file per vedere l'anteprima.</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>
<script>
document.getElementById('wordFile').addEventListener('change', function(e){
  var file=e.target.files[0]; if(!file) return;
  var reader=new FileReader();
  reader.onload=function(event){
    mammoth.convertToHtml({arrayBuffer:event.target.result},{
      styleMap:["p[style-name='Heading 1'] => h2","p[style-name='Heading 2'] => h3","p[style-name='Heading 3'] => h4","p[style-name='Quote'] => blockquote","p[style-name='Intestazione'] => p","p[style-name='Piè di pagina'] => p"]
    }).then(function(result){
      var html=result.value;
      var md=htmlToMarkdown(html);
      document.getElementById('output').value=md;
      document.getElementById('previewBody').innerHTML=html;
      document.getElementById('status').textContent='Conversione completata!';
    }).catch(function(err){
      document.getElementById('status').textContent='Errore: '+err.message;
    });
  };
  reader.readAsArrayBuffer(file);
});

function htmlToMarkdown(html){
  var div=document.createElement('div'); div.innerHTML=html;
  var out='';
  function walk(node){
    if(node.nodeType===3){
      var t=node.textContent;
      t=t.replace(/\u00A0/g,' ');
      out+=t;
      return;
    }
    if(node.nodeType!==1) return;
    var tag=node.tagName.toLowerCase();
    if(tag==='script'||tag==='style') return;
    if(tag==='p'){
      var style=node.getAttribute('style')||'';
      var m=style.match(/text-indent:\s*([0-9.]+)pt/);
      if(m && parseFloat(m[1])>0){
        out+='\n\n> ';
        for(var i=0;i<node.childNodes.length;i++) walk(node.childNodes[i]);
        out+='\n\n';
        return;
      }
      out+='\n\n';
      for(var i=0;i<node.childNodes.length;i++) walk(node.childNodes[i]);
      out+='\n\n';
      return;
    }
    if(tag==='blockquote'){
      out+='\n\n> ';
      for(var i=0;i<node.childNodes.length;i++) walk(node.childNodes[i]);
      out+='\n\n';
      return;
    }
    if(tag==='h1'||tag==='h2'){out+='\n\n## '; for(var i=0;i<node.childNodes.length;i++) walk(node.childNodes[i]); out+='\n\n'; return;}
    if(tag==='h3'){out+='\n\n### '; for(var i=0;i<node.childNodes.length;i++) walk(node.childNodes[i]); out+='\n\n'; return;}
    if(tag==='h4'){out+='\n\n#### '; for(var i=0;i<node.childNodes.length;i++) walk(node.childNodes[i]); out+='\n\n'; return;}
    if(tag==='strong'||tag==='b'){out+='**'; for(var i=0;i<node.childNodes.length;i++) walk(node.childNodes[i]); out+='**'; return;}
    if(tag==='em'||tag==='i'){out+='*'; for(var i=0;i<node.childNodes.length;i++) walk(node.childNodes[i]); out+='*'; return;}
    if(tag==='s'||tag==='strike'||tag==='del'){out+='~~'; for(var i=0;i<node.childNodes.length;i++) walk(node.childNodes[i]); out+='~~'; return;}
    if(tag==='br'){out+='\n'; return;}
    if(tag==='a'){out+='['; for(var i=0;i<node.childNodes.length;i++) walk(node.childNodes[i]); out+=']('+node.getAttribute('href')+')'; return;}
    if(tag==='img'){out+='!['+(node.getAttribute('alt')||'')+']('+node.getAttribute('src')+')'; return;}
    if(tag==='ul'){for(var i=0;i<node.childNodes.length;i++){var li=node.childNodes[i]; if(li.nodeType===1&&li.tagName.toLowerCase()==='li'){out+='\n- '; for(var j=0;j<li.childNodes.length;j++) walk(li.childNodes[j]);}} out+='\n\n'; return;}
    if(tag==='ol'){var n=1; for(var i=0;i<node.childNodes.length;i++){var li=node.childNodes[i]; if(li.nodeType===1&&li.tagName.toLowerCase()==='li'){out+='\n'+n+'. '; n++; for(var j=0;j<li.childNodes.length;j++) walk(li.childNodes[j]);}} out+='\n\n'; return;}
    for(var i=0;i<node.childNodes.length;i++) walk(node.childNodes[i]);
  }
  walk(div);
  return out.replace(/\n{3,}/g,'\n\n').trim();
}

document.getElementById('btnCopy').addEventListener('click',function(){
  var t=document.getElementById('output'); t.select(); document.execCommand('copy');
  var s=document.getElementById('status'); s.textContent='Markdown copiato!'; setTimeout(function(){s.textContent='';},2000);
});
</script>
</body>
</html>
