<!-- HEADER -->

  <div class="header-inner">
    <a href="index.html" class="brand brand-logo">Erosioni</a>
    <button class="nav-toggle" id="navToggle" aria-label="Apri il menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <nav class="main-nav" id="mainNav">
      <a href="articoli.html">Articoli</a>
      <a href="portfolio.html">Portfolio</a>
      <a href="bio.html">Bio</a>
      <a href="contatti.html">Contatti</a>
    </nav>
  </div>
</header>

<!-- INTESTAZIONE ARTICOLO -->
<section class="article-page-header article-reveal">
  <div class="article-container">
    <p class="article-eyebrow" id="articleEyebrow">&nbsp;</p>
    <h1 class="article-page-title" id="articleTitle">&nbsp;</h1>
    <p class="article-page-meta" id="articleMeta">&nbsp;</p>
  </div>
</section>

<div class="article-hero-frame article-reveal" id="articleHeroFrame">
  <img class="article-hero-img" id="articleHeroImg" src="" alt="">
</div>

<!-- CORPO ARTICOLO -->
<section>
  <div class="article-container">
    <div class="article-body" id="articleBody"></div>

    <!-- COMMENTI -->
    <div class="comment-form-section">
      <h2>Lascia un commento</h2>
      <form class="comment-form" id="commentForm">
        <div class="form-row">
          <div>
            <label for="comment-name">Nome</label>
            <input type="text" id="comment-name" name="name" required>
          </div>
          <div>
            <label for="comment-email">Email</label>
            <input type="email" id="comment-email" name="email" required>
          </div>
        </div>
        <div>
          <label for="comment-message">Commento</label>
          <textarea id="comment-message" name="message" rows="5" required></textarea>
        </div>
        <button type="submit">Invia commento</button>
        <p class="comment-note" id="commentNote" hidden>Grazie per il tuo commento! Verrà pubblicato a breve.</p>
      </form>
    </div>

    <!-- ULTIMI ARTICOLI -->
    <div class="latest-articles-panel">
      <h2>Ultimi articoli</h2>
      <p class="sidebar-note">Continua a leggere:</p>
      <div class="archive-list" id="latestArticlesList"></div>
    </div>
  </div>
</section>

<!-- FOOTER -->
<footer class="site-footer" style="background-image: linear-gradient(180deg, rgba(44,62,80,0.5) 0%, rgba(44,62,80,0.85) 100%), url('images/footer-bg.jpg');">
